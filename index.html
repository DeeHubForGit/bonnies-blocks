<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./assets/icons/bunny_browser_tab.png">
    <title>Bunnies World - Builder Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
        }

        #game-container {
            width: 100vw;
            height: 100dvh;
            box-sizing: border-box;
            padding: 8px;
            padding-top: max(8px, env(safe-area-inset-top));
            padding-bottom: max(8px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        canvas {
            display: block;
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 100%;
            max-height: 100%;
        }
        
        /* Mobile-specific adjustments */
        @media (max-width: 600px) {
            #game-container {
                padding: 4px;
            }
            
            canvas {
                border-width: 2px;
            }
        }
        
        /* Portrait mode overlay */
        #portrait-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #87CEEB 0%, #B0E0E6 100%);
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #portrait-overlay.show {
            display: flex;
        }
        
        .rotate-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: rotate-pulse 2s ease-in-out infinite;
        }
        
        @keyframes rotate-pulse {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(-15deg) scale(1.1);
            }
            75% {
                transform: rotate(15deg) scale(1.1);
            }
        }
        
        .overlay-title {
            font-size: 28px;
            color: #fff;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .overlay-message {
            font-size: 20px;
            color: #fff;
            margin: 10px 0;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Portrait mode overlay -->
    <div id="portrait-overlay">
        <div class="rotate-icon">📱</div>
        <div class="overlay-title">Please rotate your phone</div>
        <div class="overlay-message">Bunnies World works best in landscape mode</div>
    </div>
    
    <div id="game-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
    <script type="module" src="src/main.js"></script>
    
    <!-- Orientation detection script -->
    <script>
        // Check if device is in mobile portrait mode
        function isMobilePortrait() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            const isMobile = width < 768; // Consider devices narrower than 768px as mobile
            const isPortrait = height > width;
            return isMobile && isPortrait;
        }
        
        // Handle orientation changes
        function handleOrientationChange() {
            const overlay = document.getElementById('portrait-overlay');
            const gameContainer = document.getElementById('game-container');
            
            if (isMobilePortrait()) {
                // Show overlay, hide game in portrait mode
                overlay.classList.add('show');
                gameContainer.style.display = 'none';
            } else {
                // Hide overlay, show game in landscape/desktop mode
                overlay.classList.remove('show');
                gameContainer.style.display = 'flex';
            }
        }
        
        // Listen for orientation and resize events
        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', handleOrientationChange);
        
        // Check orientation on initial load
        handleOrientationChange();
    </script>
</body>
</html>
