<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonnie's Blocks - Builder Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #87CEEB;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            max-width: 100%;
            overflow: hidden;
        }
        canvas {
            border: 4px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            max-width: 100vw;
            height: auto;
        }
        
        /* Mobile-specific adjustments */
        @media (max-width: 600px) {
            #game-container {
                justify-content: flex-start; /* Align to top instead of center */
                padding-top: 20px; /* Add small top padding (moves game up by ~60px compared to centered) */
            }
            
            canvas {
                border-width: 2px; /* Thinner border on mobile to save space */
            }
        }
        #copyright {
            position: fixed;
            bottom: 6px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: #333;
            opacity: 0.8;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <div id="copyright">
        Made by Dee for Bonnie 💜<br>
        © 2026 Dee Bath
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.js"></script>
    <script type="module" src="src/main.js"></script>
</body>
</html>
